<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ENGINE 44 — Hangar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0e0f11;
        color: #b8bec4;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      #game {
        position: relative; /* anchors .video-overlay to the canvas's own box */
        /* Phaser's FIT scale mode sizes the canvas to this box: up to the
           native 960px on desktop, shrinking on narrower windows. */
        width: min(100%, 960px);
        aspect-ratio: 3 / 2;
      }
      #game canvas {
        image-rendering: pixelated;
        box-shadow: 0 0 0 1px #2a2d31; /* not a border, which would push the canvas past #game's box */
      }
      p { margin: 0; }

      /* ---- touch devices (html.touch is set by touch.js: coarse pointer,
         or ?touch=1 for testing). The game fills the viewport (Phaser FIT
         letterboxes the fixed 3:2 canvas inside it), the page never
         scrolls/zooms/pull-to-refreshes, and the on-screen controls show. ---- */
      html.touch, html.touch body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      html.touch #app {
        padding: 0;
        gap: 0;
        height: 100vh;
        height: 100dvh;
        justify-content: center;
      }
      html.touch #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        aspect-ratio: auto;
        touch-action: none;
      }
      html.touch #app > p { display: none; }

      .rotate-hint { display: none; }
      @media (orientation: portrait) {
        html.touch .rotate-hint {
          display: block;
          position: fixed;
          top: calc(12px + env(safe-area-inset-top, 0px));
          left: 0;
          right: 0;
          text-align: center;
          font-size: 11px;
          letter-spacing: 0.06em;
          color: #8a95a3;
          pointer-events: none;
        }
      }

      /* ---- on-screen touch controls (touch.js) ---- */
      .touch-controls { display: none; }
      html.touch .touch-controls {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 5000; /* above the canvas, below the story form (10000) and video (20000) overlays */
        pointer-events: none; /* only the stick and button themselves take touches */
      }
      .tc-stick, .tc-interact {
        position: absolute;
        bottom: calc(22px + env(safe-area-inset-bottom, 0px));
        pointer-events: auto;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      .tc-stick {
        left: calc(22px + env(safe-area-inset-left, 0px));
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
        border: 2px solid rgba(255, 122, 51, 0.45);
      }
      .tc-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 122, 51, 0.4);
        border: 2px solid rgba(255, 122, 51, 0.7);
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .tc-interact {
        right: calc(22px + env(safe-area-inset-right, 0px));
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid rgba(255, 122, 51, 0.6);
        background: rgba(255, 122, 51, 0.18);
        color: rgba(255, 190, 150, 0.95);
        font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        padding: 0;
      }
      .tc-interact:active { background: rgba(255, 122, 51, 0.4); }

      /* ---- intro/outro video overlay (video.js) — a plain <video> layered
         over the canvas, same angular-panel / rust-orange language as the
         in-game dialogue box and story forms. ---- */
      .video-overlay {
        position: absolute;
        inset: 0;
        z-index: 20000;
        background: #000;
        overflow: hidden;
      }
      .video-overlay-el {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .video-skip-btn, .video-mute-btn {
        position: absolute;
        top: 12px;
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 14px;
        border: 1px solid #b85a26;
        color: #ff7a33;
        background: rgba(11, 14, 18, 0.75);
        cursor: pointer;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }
      .video-skip-btn:hover, .video-mute-btn:hover { background: rgba(255, 122, 51, 0.2); }
      .video-skip-btn { right: 12px; }
      .video-mute-btn { left: 12px; }

      /* ---- story form overlay (registration / wallet) — DOM, not
         Phaser, since canvas has no real text-input widget. Same
         angular-panel / rust-orange language as the in-game dialogue
         box and ASK indicator (see dialogue.js's drawAngularPanel). ---- */
      .story-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 7, 10, 0.72);
        display: flex;
        overflow-y: auto; /* short landscape phones: let the form scroll instead of clipping */
        z-index: 10000;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .story-panel {
        margin: auto; /* centers, but stays scrollable when taller than the viewport */
        position: relative;
        width: min(420px, 92vw);
        background: #12161c;
        border: 1px solid #3a4553;
        clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
        padding: 22px 24px 20px;
        color: #e9e7e0;
      }
      .story-panel h2 {
        font-family: "Stardos Stencil", "Arial Black", Impact, sans-serif;
        font-size: 19px;
        letter-spacing: 0.03em;
        margin: 0 0 16px;
        color: #ff7a33;
        text-wrap: balance;
      }
      .story-field { margin-bottom: 14px; }
      .story-field label {
        display: block;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8a95a3;
        margin-bottom: 6px;
      }
      .story-input-row {
        display: flex;
        align-items: center;
        background: #0d1117;
        border: 1px solid #262e39;
        padding: 0 10px;
      }
      .story-input-row:focus-within { border-color: #ff7a33; }
      .story-input-prefix { color: #8a95a3; padding-right: 2px; }
      .story-input-row input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: #e9e7e0;
        font: 14px/2.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 0;
      }
      .story-links { display: flex; gap: 10px; margin: 4px 0 18px; flex-wrap: wrap; }
      .story-link-btn {
        flex: 1 1 120px;
        text-align: center;
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 9px 8px;
        border: 1px solid #b85a26;
        color: #ff7a33;
        background: rgba(255, 122, 51, 0.08);
        text-decoration: none;
        cursor: pointer;
      }
      .story-link-btn:hover { background: rgba(255, 122, 51, 0.16); }
      .story-submit {
        width: 100%;
        padding: 11px;
        font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
        background: #ff7a33;
        color: #12161c;
        border: 0;
        cursor: pointer;
      }
      .story-submit:hover { background: #ff8f52; }
      .story-hint {
        margin-top: 10px;
        font-size: 10px;
        color: #5b6572;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="rotate-hint">↻ Rotate your device for a larger view</div>
    <div id="app">
      <div id="game"></div>
      <p><strong>WASD</strong> / <strong>Arrows</strong> to move &nbsp;·&nbsp; walk into either <strong>ladder</strong> to go up or back down</p>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
